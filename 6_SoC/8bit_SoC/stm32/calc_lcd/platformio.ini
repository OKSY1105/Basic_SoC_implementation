; 8bit SoC - STM32 receiver: FPGA UART reply lines -> 16x2 I2C LCD.
; Same environment as the earlier bare-metal project
; Embedded_System/Bare_Metal/platformIO/10_USART (CMSIS, no HAL).
[platformio]
include_dir = Inc

[env:nucleo_f439zi]
platform = ststm32
board = nucleo_f439zi
framework = cmsis
upload_protocol = stlink
debug_tool = stlink
build_flags = -Wall -Wextra
